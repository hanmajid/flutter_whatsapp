name: flutter_whatsapp
description: "Whatsapp clone made with Flutter"
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  # ext_storage: ^1.0.3
  intl: ^0.20.1
  http: ^1.2.2
  contacts_service: ^0.6.3
  cached_network_image: ^3.4.1
  camera: ^0.11.0+2
#  video_player: ^0.10.0+5
  path_provider: ^2.1.5 
  fluro: ^2.0.5
  sliding_up_panel: ^2.0.0
  flutter_app_badger: ^1.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  android_intent: ^2.0.2
  permission_handler: ^11.3.1
